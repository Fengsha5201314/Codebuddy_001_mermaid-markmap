name: 发布风沙桌面版

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    name: 构建 Windows 安装包
    runs-on: windows-latest
    defaults:
      run:
        working-directory: chart-visualizer

    steps:
      - name: 获取源码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装 pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@10.13.1 --activate
          pnpm --version

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 校验标签与软件版本
        id: version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("${{ github.ref_type }}" -eq "tag") {
            $tagVersion = "${{ github.ref_name }}" -replace '^v', ''
            if ($packageVersion -ne $tagVersion) {
              throw "标签版本 $tagVersion 与 package.json 版本 $packageVersion 不一致"
            }
          }
          "version=$packageVersion" >> $env:GITHUB_OUTPUT
          "tag=v$packageVersion" >> $env:GITHUB_OUTPUT

      - name: 测试
        run: pnpm test

      - name: 构建安装包
        run: pnpm desktop:build

      - name: 发布安装包和自动更新元数据
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $version = "${{ steps.version.outputs.version }}"
          $repository = "${{ github.repository }}"
          gh api "repos/$repository/releases/tags/$tag" --silent 2>$null
          if ($LASTEXITCODE -ne 0) {
            $releaseReady = $false
            for ($attempt = 1; $attempt -le 5; $attempt++) {
              gh release create $tag --repo $repository --verify-tag --generate-notes --title "风沙图表工作台 $version"
              if ($LASTEXITCODE -eq 0) {
                $releaseReady = $true
                break
              }
              gh api "repos/$repository/releases/tags/$tag" --silent 2>$null
              if ($LASTEXITCODE -eq 0) {
                $releaseReady = $true
                break
              }
              if ($attempt -lt 5) {
                Start-Sleep -Seconds (5 * $attempt)
              }
            }
            if (-not $releaseReady) {
              throw "GitHub Release 创建失败"
            }
          }
          $uploadComplete = $false
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            gh release upload $tag `
              "release/Fengsha-Diagram-Setup-$version-x64.exe" `
              "release/Fengsha-Diagram-Setup-$version-x64.exe.blockmap" `
              "release/latest.yml" `
              --clobber --repo $repository
            if ($LASTEXITCODE -eq 0) {
              $uploadComplete = $true
              break
            }
            if ($attempt -lt 5) {
              Start-Sleep -Seconds (5 * $attempt)
            }
          }
          if (-not $uploadComplete) {
            throw "GitHub Release 资产上传失败"
          }
